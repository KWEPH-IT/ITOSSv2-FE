server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static Vite assets must exist.
    # Do not fall back to index.html if an asset is missing.
    location /assets/ {
        try_files $uri =404;
    }

    # React/Vite SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
